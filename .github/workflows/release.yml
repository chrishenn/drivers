name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true
        persist-credentials: false

    - name: Archive Release
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: zip
        filename: intel.zip
        path: ./intel
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: intel.zip
        path: intel.zip
        overwrite: true

    - name: Archive Release
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: zip
        filename: Z790_gigabyte_udac.zip
        path: ./Z790_gigabyte_udac
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Z790_gigabyte_udac.zip
        path: Z790_gigabyte_udac.zip
        overwrite: true

    - name: Archive Release
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: zip
        filename: X870E_gigabyte_master.zip
        path: ./X870E_gigabyte_master
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: X870E_gigabyte_master.zip
        path: X870E_gigabyte_master.zip
        overwrite: true

    - name: Archive Release
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: zip
        filename: XPS9320.zip
        path: ./XPS9320
    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: XPS9320.zip
        path: XPS9320.zip
        overwrite: true

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intel.zip
          path: pkg
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Z790_gigabyte_udac.zip
          path: pkg
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: X870E_gigabyte_master.zip
          path: pkg
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: XPS9320.zip
          path: pkg

      - name: GitHub Release
        run: |
          gh release delete "${GITHUB_REF_NAME}" --repo ${{ github.repository }} || true
          gh release create "${GITHUB_REF_NAME}" pkg/* --repo ${{ github.repository }} --title "${GITHUB_REF_NAME}" --notes "Automated release of ${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
