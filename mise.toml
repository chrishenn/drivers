[tools]
actionlint = "latest"
hk = "latest"
pinact = "latest"
pkl = "latest"
zizmor = "latest"

[tasks.fix]
alias = "f"
description = "run project formatters declared in hk.pkl in 'fix' mode"
run = "hk fix --all"

[tasks.check]
alias = "c"
description = "run project linters declared in hk.pkl in 'check' mode"
run = "hk check --all"

[tasks.sync]
alias = 's'
description = "git: sync local changes to remote"
usage = 'arg "<msg>" default="sync"'
run = 'git add -A && git commit -am "{{usage.msg}}" && git pull && git push'

[tasks.release]
description = "force-tag and push a version release"
alias = "rel"
run = '''
ver="$(cat ./version)"
git add -A
git commit -am "Automated release of: v$ver"
git push
git tag -a "v$ver" -m "Automated release of: v$ver" -f
git push --tags -f
'''
